name: CI/CD DevOpsGPT
on:
  push:
    branches:
      - main
    tags:
      - "v*"
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - name: Deploy
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "Déploiement en cours..."
